[program:self_evolving_agent]
command=python /workspace/self_evolving_agent/main.py 9999999
 directory=/workspace/self_evolving_agent
 autostart=true
 autorestart=true
 startsecs=5
 startretries=3
 stopwaitsecs=10
 stdout_logfile=/workspace/self_evolving_agent/logs/agent_supervisor.log
 stderr_logfile=/workspace/self_evolving_agent/logs/agent_supervisor_error.log
 environment=PYTHONPATH="/workspace/self_evolving_agent",AGENT_CONFIG="/workspace/self_evolving_agent/config/agent.yaml"
