[program:self_evolving_agent]
command=%(here)s/../main.py run --forever --enable-multi-agent --enable-forever --rest-port 9090 --dashboard-port 8080
directory=%(here)s/..
autostart=true
autorestart=true
startsecs=5
startretries=3
stopwaitsecs=10
stdout_logfile=%(here)s/../logs/agent_supervisor.log
stderr_logfile=%(here)s/../logs/agent_supervisor_error.log
environment=PYTHONPATH="%(here)s/..",AGENT_CONFIG="%(here)s/../config/agent.yaml",AGENT_ENV="prod"
