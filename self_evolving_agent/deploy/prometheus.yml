# Prometheus 抓取配置 —— 自驱Agent系统
global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # Agent 自身的指标端点（由 deploy/metrics_server.py 暴露）
  - job_name: "self-evolving-agent"
    static_configs:
      - targets: ["agent:8080"]
    metrics_path: /metrics
    scrape_interval: 10s

  # 可选：抓取 Agent 的 REST API 健康端点
  - job_name: "agent-rest-health"
    static_configs:
      - targets: ["agent:9090"]
    metrics_path: /health
    scrape_interval: 30s
