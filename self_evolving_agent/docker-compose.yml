# 自驱永续进化Agent系统 —— Docker Compose 编排
# U4：一键部署，可选监控栈
#
# 基本用法：
#   docker compose up -d
#
# 启用监控栈（Prometheus + Grafana）：
#   docker compose --profile monitoring up -d
#
# 环境变量可在 .env 文件中覆盖：
#   AGENT_REST_PORT=9090
#   AGENT_DASHBOARD_PORT=8080
#   AGENT_ENV=prod

services:
  agent:
    build: .
    image: self-evolving-agent:latest
    container_name: self-evolving-agent
    restart: unless-stopped
    ports:
      - "${AGENT_REST_PORT:-9090}:9090"
      - "${AGENT_DASHBOARD_PORT:-8080}:8080"
    environment:
      - AGENT_ENV=${AGENT_ENV:-prod}
      - AGENT_CONFIG=/app/config/agent.yaml
      - PYTHONPATH=/app
    volumes:
      - agent-logs:/app/logs
      - agent-data:/app/data
      - ./config:/app/config:ro
    healthcheck:
      test: ["CMD", "python", "-c", "from cli import cli_main; import sys; sys.exit(cli_main(['health']))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"

  # 可选：Prometheus 指标采集（通过 --profile monitoring 启用）
  prometheus:
    profiles: ["monitoring"]
    image: prom/prometheus:latest
    container_name: self-evolving-prometheus
    restart: unless-stopped
    ports:
      - "${PROMETHEUS_PORT:-9091}:9090"
    volumes:
      - ./deploy/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    depends_on:
      - agent

  # 可选：Grafana 可视化面板（通过 --profile monitoring 启用）
  grafana:
    profiles: ["monitoring"]
    image: grafana/grafana:latest
    container_name: self-evolving-grafana
    restart: unless-stopped
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-admin}
    volumes:
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus

volumes:
  agent-logs:
  agent-data:
  prometheus-data:
  grafana-data:
